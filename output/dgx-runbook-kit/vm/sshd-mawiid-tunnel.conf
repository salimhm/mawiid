# Append this block to the END of /etc/ssh/sshd_config on the VM (a Match block must come last).
# It lets the tunnel account, and only it, bind its remote forward to the Docker bridge address.
# Then: sudo sshd -t && sudo systemctl reload ssh
Match User mawiid-tunnel
    GatewayPorts clientspecified
    AllowTcpForwarding yes
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
