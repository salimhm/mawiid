global:
  scrape_interval: 5s
  evaluation_interval: 5s

  external_labels:
    environment: production
    project: mawiid

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["app-vm.private:3000"]
        labels:
          location: app-vm
    metrics_path: /metrics

  - job_name: ai
    static_configs:
      - targets: ["127.0.0.1:9464"]
        labels:
          location: gpu-vm
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
