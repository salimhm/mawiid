global:
  scrape_interval: 5s
  evaluation_interval: 5s

  external_labels:
    environment: local
    project: mawiid

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["host.docker.internal:3000"]
    metrics_path: /metrics

  - job_name: ai
    static_configs:
      - targets: ["host.docker.internal:9464"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
